name: CampusX Smart Keep-Alive

on:
  schedule:
    # GitHub Actions supports a minimum 5-minute schedule. Offset from minute 0.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/keep-alive.yml"
      - "scripts/keep-alive.js"
      - "scripts/keep-alive.test.js"
      - "apps/backend/src/config/env.ts"
      - "apps/backend/src/models/KeepAliveState.ts"
      - "apps/backend/src/middleware/activity.ts"
      - "apps/backend/src/middleware/auth.ts"
      - "apps/backend/src/sockets/index.ts"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --workspace @campusx/backend --include-workspace-root=false
      - name: Typecheck backend
        run: npm run typecheck --workspace @campusx/backend
      - name: Test keep-alive decision logic
        run: node --test scripts/keep-alive.test.js

  keep-alive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 4
    concurrency:
      group: campusx-render-smart-keepalive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install scheduler dependency only
        run: npm install --prefix "$RUNNER_TEMP/keepalive-deps" --no-save --ignore-scripts mongoose@8.18.1
      - name: Evaluate activity and keep Render awake only when needed
        env:
          NODE_PATH: ${{ runner.temp }}/keepalive-deps/node_modules
          MONGO_URI: ${{ secrets.MONGO_URI }}
          KEEP_ALIVE_THRESHOLD_MINUTES: "8"
          RENDER_HEALTH_URL: "https://campusx-production.onrender.com/api/health"
        run: node scripts/keep-alive.js
